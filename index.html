<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUZIX SHOP | OFFICIAL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        /* Caricamento Font Locale */
        @font-face {
            font-family: 'Next Ups';
            src: url('Next Ups.ttf') format('truetype');
        }

        :root {
            --nintendo-red: #e60012;
            --bg-color: #f0f0f0; /* Grigio chiaro tipo Nintendo */
            --text-dark: #333;
            --white: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Urbanist', sans-serif;
            color: var(--text-dark);
        }

        /* HEADER CON TITOLO IN ALTO A DESTRA */
        header {
            width: 100%;
            padding: 30px 50px;
            display: flex;
            justify-content: flex-end; /* Sposta a destra */
            background-color: var(--white);
            border-bottom: 2px solid #ddd;
        }

        .logo {
            font-family: 'Next Ups', sans-serif;
            font-size: 40px;
            color: var(--text-dark);
            text-transform: uppercase; /* Tutto CAPS */
            letter-spacing: 2px;
        }

        /* CONTENITORE PRINCIPALE SHOP */
        .shop-container {
            max-width: 1200px;
            margin: 50px auto;
            display: flex;
            flex-direction: column;
            gap: 40px;
            padding: 0 20px;
        }

        /* LAYOUT PRODOTTO (ISPIRATO ALLA TUA FOTO) */
        .product-card {
            background: var(--white);
            display: grid;
            grid-template-columns: 1fr 1fr; /* Due colonne: Immagine | Info */
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border: 1px solid #ddd;
        }

        /* Parte sinistra: Immagini */
        .product-gallery {
            padding: 30px;
            background-color: #fafafa;
            border-right: 1px solid #eee;
        }

        .main-img {
            width: 100%;
            height: 350px;
            object-fit: contain;
            background: #eee;
            border-radius: 4px;
            margin-bottom: 15px;
        }

        .thumbnails {
            display: flex;
            gap: 10px;
        }

        .thumb {
            width: 80px;
            height: 50px;
            background: #ddd;
            border-radius: 2px;
            border: 2px solid transparent;
        }

        .thumb.active {
            border-color: var(--nintendo-red);
        }

        /* Parte destra: Dettagli */
        .product-details {
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .category {
            font-size: 14px;
            font-weight: 700;
            color: #888;
            text-transform: uppercase;
        }

        .product-title {
            font-size: 48px;
            font-weight: 700;
            margin: 0;
            color: #000;
        }

        .price-section {
            display: flex;
            align-items: baseline;
            gap: 10px;
        }

        .price {
            font-size: 36px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .iva {
            font-size: 14px;
            color: #666;
        }

        .description {
            font-size: 18px;
            line-height: 1.6;
            color: #444;
            margin-bottom: 20px;
        }

        /* Opzioni (Versione/Blocco come nella foto) */
        .options-group {
            margin-bottom: 15px;
        }

        .label {
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 10px;
            display: block;
            text-transform: uppercase;
        }

        .option-box {
            padding: 10px 15px;
            border: 2px solid #ddd;
            border-radius: 4px;
            display: inline-block;
            font-weight: 600;
            font-size: 14px;
            margin-right: 10px;
        }

        .option-box.selected {
            border-color: var(--nintendo-red);
        }

        /* TASTO COMPRA NINTENDO RED */
        .buy-button {
            background-color: var(--nintendo-red);
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: 700;
            text-align: center;
            transition: background 0.3s;
            display: block;
            margin-top: auto;
        }

        .buy-button:hover {
            background-color: #ff1a2e;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .product-card {
                grid-template-columns: 1fr;
            }
            header {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">SUZIX SHOP</div>
    </header>

    <main class="shop-container">

        <article class="product-card">
            <div class="product-gallery">
                <img src="suzix.png" alt="Suzix Tool" class="main-img" onerror="this.src='https://via.placeholder.com/600x400?text=Suzix+Image'">
                <div class="thumbnails">
                    <div class="thumb active"></div>
                    <div class="thumb"></div>
                    <div class="thumb"></div>
                </div>
            </div>
            <div class="product-details">
                <span class="category">Minecraft Nuker / Raid Tool</span>
                <h2 class="product-title">Suzix</h2>
                <div class="price-section">
                    <span class="price">2,00 €</span>
                    <span class="iva">(IVA INCLUSA)</span>
                </div>
                <p class="description">
                    Suzix è un tool professionale progettato per nukkare server Minecraft. 
                    Ottimizzato per agire su server senza protezioni auth, garantisce una 
                    distruzione rapida e pulita senza rallentamenti.
                </p>
                <div class="options-group">
                    <span class="label">Versione</span>
                    <div class="option-box selected">RAIDER EDITION</div>
                    <div class="option-box">PRO (SOON)</div>
                </div>
